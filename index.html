<script>const D={"ko": {"native": "한국어", "rtl": false, "name": "차근차근", "subtitle": "발달장애 아이의 하루를 그림으로", "promo": "하루 일과, 단계별 활동, 기다리기, 말하기 판(AAC)까지. 그림 카드와 읽어 주는 소리로 아이가 스스로 해내요. 7일 무료로 써 보세요.", "body": "차근차근은 발달장애가 있는 아이가 하루를 그림으로 보고, 한 단계씩 스스로 해내도록 돕는 앱이에요.\n숫자나 글자를 아직 몰라도 괜찮아요. 큰 그림 타일, 읽어 주는 목소리, 끌어 넣기처럼 쉬운 동작만 있어요.\n\n■ 아이 화면\n• 하루 일과: 아침·하교 후·잠자기 일과를 순서대로\n• 따라하기: 손 씻기·요리·버스 타기처럼 단계가 있는 일을 하나씩, 끝낸 단계는 '다 했어요' 칸으로\n• 기다리기 다이얼, 마음 알기, 칭찬 토큰과 보상\n• 말하기 판(AAC): 핵심 낱말 24개와 주제별 폴더, 스위치로 고르기\n• 어느 화면에나 있는 말하기 바: 도와주세요·쉬고 싶어요·화장실·아파요\n• 낱말 카드, 사회 이야기, 장소 이야기, 외출 준비물, 목소리 크기 알아보기\n\n■ 내 아이에 맞게\n• 컬러 그림·픽토그램 두 그림체의 그림 카드 1,200장 이상\n• 카드마다 우리 집 사진으로 바꾸고, 이름과 읽어 줄 말을 고쳐요\n• 준비된 활동 70여 가지를 복사해 단계를 고쳐 써요\n• 아이가 쓰는 화면에서 자물쇠를 3초 누르면 그 화면을 바로 고쳐요\n• 말하기 판 낱말에 보호자 목소리를 녹음해요\n\n■ 보호자·선생님\n• 혼자 했는지, 도움을 받았는지 기록하고 성장을 모아 봐요\n• 집에서는 태블릿, 밖에서는 휴대폰. 여러 아이와 여러 보호자\n• 28개 언어\n\n■ 구독 안내\n처음 7일은 모든 기능이 무료예요. 체험이 끝나기 24시간 전까지 스토어 구독 설정에서 취소하면 결제되지 않고, 취소하지 않으면 고른 월간 또는 연간 구독이 시작되어 자동으로 갱신돼요. 아이의 의사소통(말하기 바·말하기 판·스위치)은 구독하지 않아도 무료예요.\n\n이용약관: https://www.apple.com/legal/internet-services/itunes/dev/stdeula/\n개인정보 처리방침: https://enkingka.github.io/chaguhn-site/privacy.html"}, "en": {"native": "English", "rtl": false, "name": "Chaguhn", "subtitle": "Visual schedules and AAC talk", "promo": "Daily routines, step-by-step tasks, a waiting timer and a talking board (AAC). Picture cards and a reading voice help your child do it alone. 7 days free.", "body": "Chaguhn (cha-GUHN) means \"step by step\" in Korean.\n\nChaguhn helps children with developmental disabilities follow their day on their own, one picture at a time.\nIt's made for children who don't read numbers or words yet: big picture tiles, a voice that reads aloud and simple drag-and-drop.\n\nFOR YOUR CHILD\n• Daily routine: morning, after school and bedtime, shown in order\n• Step by step: hand washing, cooking, taking the bus. Drag each finished step into the Done box\n• Waiting dial, feelings, praise tokens and rewards\n• Talking board (AAC) with 24 core words and topic folders, switch scanning\n• A talking bar on every screen: Help me, I want a break, Toilet, It hurts\n• Word cards, social stories, place stories, outing checklist, voice-volume meter\n\nMAKE IT FIT YOUR CHILD\n• Over 1,200 picture cards in colour or pictogram style\n• Swap any card for a photo from home and change its name and spoken words\n• Copy 70+ ready-made activities and edit the steps\n• Hold the lock on any child screen for 3 seconds to edit that screen right away\n• Record your own voice for talking-board words\n\nFOR GUARDIANS AND TEACHERS\n• Record whether your child did it alone or with help and see progress over time\n• A tablet at home and a phone outside, several children and adults\n• 28 languages\n\nSUBSCRIPTION\nEvery feature is free for the first 7 days. Cancel in your store subscription settings at least 24 hours before the trial ends and you won't be charged; otherwise the monthly or yearly plan you chose starts and renews automatically. Your child's communication (talking bar, talking board, switch access) stays free without a subscription.\n\nTerms of use: https://www.apple.com/legal/internet-services/itunes/dev/stdeula/\nPrivacy policy: https://enkingka.github.io/chaguhn-site/privacy.html"}, "ja": {"native": "日本語", "rtl": false, "name": "Chaguhn", "subtitle": "発達がゆっくりな子の毎日を絵で", "promo": "一日の日課、手順のある活動、待つタイマー、おしゃべりボード（AAC）。絵カードと読み上げの声で、お子さんが自分でできるようになります。7日間無料。", "body": "Chaguhnは、発達障害のある子どもが一日を絵で見て、一つずつ自分でできるように手助けするアプリです。\n数字や文字がまだわからなくても大丈夫。大きな絵のタイル、読み上げる声、ドラッグのようなかんたんな操作だけです。\n\n■ 子どもの画面\n• 一日の日課：朝・放課後・寝る前の日課を順番に\n• まねっこ：手洗い・料理・バスに乗るなど手順のあることを一つずつ。終わった手順は「できた」の箱へ\n• 待つダイヤル、きもち、ごほうびトークンとごほうび\n• おしゃべりボード（AAC）：コアことば24語とテーマ別フォルダー、スイッチで選ぶ\n• どの画面にもあるおしゃべりバー：たすけて・休みたい・トイレ・いたい\n• ことばカード、ソーシャルストーリー、場所のおはなし、おでかけの持ち物、声の大きさメーター\n\n■ お子さんに合わせて\n• カラーイラストとピクトグラム、2つの絵柄の絵カード1,200枚以上\n• どのカードも家の写真に変えられ、名前や読み上げることばも直せます\n• 用意された70以上の活動をコピーして手順を直せます\n• 子どもが使っている画面で鍵を3秒押すと、その画面をすぐ直せます\n• おしゃべりボードのことばを保護者の声で録音できます\n\n■ 保護者・先生\n• ひとりでできたか、手伝ってもらったかを記録し、成長を見られます\n• 家ではタブレット、外ではスマホ。複数の子ども・複数の保護者\n• 28言語\n\n■ 購読について\n最初の7日間はすべての機能が無料です。体験が終わる24時間前までにストアの購読設定で解約すれば請求されません。解約しなければ、選んだ月額または年額プランが始まり、自動で更新されます。お子さんのコミュニケーション（おしゃべりバー・おしゃべりボード・スイッチ）は購読しなくても無料です。\n\n利用規約：https://www.apple.com/legal/internet-services/itunes/dev/stdeula/\nプライバシーポリシー：https://enkingka.github.io/chaguhn-site/privacy.html"}, "zh-Hans": {"native": "简体中文", "rtl": false, "name": "Chaguhn", "subtitle": "用图片帮助孩子过好每一天", "promo": "一天的日程、分步骤的活动、等待计时器和说话板（AAC）。图片卡片和朗读声音帮助孩子自己完成。免费试用7天。", "body": "Chaguhn帮助发育障碍的孩子用图片看懂一天，一步一步自己完成。\n还不认识数字和文字也没关系。只有大图片方块、朗读的声音和拖动这样简单的操作。\n\n■ 孩子界面\n• 一天的日程：早上、放学后、睡觉前的日程按顺序显示\n• 一步一步：洗手、做饭、坐公交车等有步骤的事一件一件做，完成的步骤拖进“完成”框\n• 等待转盘、心情、表扬代币和奖励\n• 说话板（AAC）：24个核心词和主题文件夹，可用开关选择\n• 每个界面都有的说话栏：帮帮我・我想休息・厕所・好痛\n• 词语卡片、社交故事、地点故事、出门清单、音量表\n\n■ 按孩子调整\n• 彩色插图和象形图两种画风的图片卡片1,200张以上\n• 每张卡片都可以换成家里的照片，也可以改名称和朗读的话\n• 复制70多个准备好的活动，修改步骤\n• 在孩子正在用的界面按住锁3秒，就能直接修改这个界面\n• 可以用家长的声音录制说话板的词语\n\n■ 家长和老师\n• 记录孩子是自己做的还是有人帮忙，查看成长变化\n• 家里用平板，外出用手机；支持多个孩子和多位家长\n• 28种语言\n\n■ 订阅说明\n前7天所有功能免费。在试用结束前24小时于商店订阅设置中取消，就不会扣费；如果不取消，所选的按月或按年订阅就会开始并自动续订。孩子的沟通功能（说话栏、说话板、开关选择）即使不订阅也免费。\n\n使用条款：https://www.apple.com/legal/internet-services/itunes/dev/stdeula/\n隐私政策：https://enkingka.github.io/chaguhn-site/privacy.html"}, "zh-Hant": {"native": "繁體中文", "rtl": false, "name": "Chaguhn", "subtitle": "用圖片幫助孩子過好每一天", "promo": "一天的日程、分步驟的活動、等待計時器和說話板（AAC）。圖片卡片和朗讀聲音幫助孩子自己完成。免費試用7天。", "body": "Chaguhn幫助發育障礙的孩子用圖片看懂一天，一步一步自己完成。\n還不認識數字和文字也沒關係。只有大圖片方塊、朗讀的聲音和拖動這樣簡單的操作。\n\n■ 孩子介面\n• 一天的日程：早上、放學後、睡覺前的日程按順序顯示\n• 一步一步：洗手、做飯、坐公交車等有步驟的事一件一件做，完成的步驟拖進“完成”框\n• 等待轉盤、心情、表揚代幣和獎勵\n• 說話板（AAC）：24個核心詞和主題資料夾，可用開關選擇\n• 每個介面都有的說話欄：幫幫我・我想休息・廁所・好痛\n• 詞語卡片、社交故事、地點故事、出門清單、音量表\n\n■ 按孩子調整\n• 彩色插圖和象形圖兩種畫風的圖片卡片1,200張以上\n• 每張卡片都可以換成家裡的照片，也可以改名稱和朗讀的話\n• 複製70多個準備好的活動，修改步驟\n• 在孩子正在用的介面按住鎖3秒，就能直接修改這個介面\n• 可以用家長的聲音錄製說話板的詞語\n\n■ 家長和老師\n• 記錄孩子是自己做的還是有人幫忙，檢視成長變化\n• 家裡用平板，外出用手機；支援多個孩子和多位家長\n• 28種語言\n\n■ 訂閱說明\n前7天所有功能免費。在試用結束前24小時於商店訂閱設定中取消，就不會扣費；如果不取消，所選的按月或按年訂閱就會開始並自動續訂。孩子的溝通功能（說話欄、說話板、開關選擇）即使不訂閱也免費。\n\n使用條款：https://www.apple.com/legal/internet-services/itunes/dev/stdeula/\n隱私政策：https://enkingka.github.io/chaguhn-site/privacy.html"}, "vi": {"native": "Tiếng Việt", "rtl": false, "name": "Chaguhn", "subtitle": "Lịch hình ảnh, bảng nói cho bé", "promo": "Lịch sinh hoạt, hoạt động từng bước, đồng hồ chờ và bảng nói (AAC). Thẻ hình và giọng đọc giúp con tự làm được. Miễn phí 7 ngày.", "body": "Chaguhn giúp trẻ có rối loạn phát triển tự làm theo một ngày của mình, từng hình một.\nDành cho trẻ chưa đọc được số hay chữ: ô hình lớn, giọng đọc to và thao tác kéo thả đơn giản.\n\nCHO CON\n• Lịch sinh hoạt: buổi sáng, sau giờ học và trước khi ngủ, theo thứ tự\n• Từng bước một: rửa tay, nấu ăn, đi xe buýt. Mỗi bước xong kéo vào ô Xong rồi\n• Mặt đồng hồ chờ, cảm xúc, xu khen thưởng và phần thưởng\n• Bảng nói (AAC) với 24 từ cốt lõi và thư mục theo chủ đề, chọn bằng công tắc\n• Thanh nói trên mọi màn hình: Giúp con, Con muốn nghỉ, Vệ sinh, Đau\n• Thẻ từ, câu chuyện xã hội, câu chuyện địa điểm, danh sách đồ mang theo, đo độ to giọng nói\n\nHỢP VỚI CON\n• Hơn 1.200 thẻ hình kiểu tranh màu hoặc biểu tượng\n• Đổi bất kỳ thẻ nào thành ảnh chụp ở nhà, đổi tên và lời đọc\n• Sao chép hơn 70 hoạt động có sẵn và sửa các bước\n• Trên màn hình của con, giữ ổ khóa 3 giây để sửa ngay màn hình đó\n• Ghi âm giọng của bạn cho các từ trên bảng nói\n\nCHO PHỤ HUYNH VÀ GIÁO VIÊN\n• Ghi lại con tự làm hay cần giúp và xem tiến bộ\n• Máy tính bảng ở nhà, điện thoại khi ra ngoài; nhiều trẻ và nhiều người lớn\n• 28 ngôn ngữ\n\nĐĂNG KÝ\n7 ngày đầu mọi thứ đều miễn phí. Nếu hủy trong cài đặt đăng ký của cửa hàng ít nhất 24 giờ trước khi hết thời gian dùng thử, bạn không mất phí; nếu không, gói tháng hoặc năm đã chọn sẽ bắt đầu và tự gia hạn. Giao tiếp của con (thanh nói, bảng nói, công tắc) vẫn miễn phí khi không đăng ký.\n\nĐiều khoản sử dụng: https://www.apple.com/legal/internet-services/itunes/dev/stdeula/\nQuyền riêng tư: https://enkingka.github.io/chaguhn-site/privacy.html"}, "th": {"native": "ไทย", "rtl": false, "name": "Chaguhn", "subtitle": "ตารางกิจวัตรแบบภาพสำหรับเด็ก", "promo": "กิจวัตรประจำวัน กิจกรรมทีละขั้นตอน ตัวจับเวลารอ และกระดานพูด (AAC) การ์ดรูปภาพและเสียงอ่านช่วยให้ลูกทำได้ด้วยตัวเอง ทดลองฟรี 7 วัน", "body": "Chaguhn ช่วยให้เด็กที่มีภาวะความบกพร่องทางพัฒนาการทำกิจวัตรในแต่ละวันได้ด้วยตัวเอง ทีละภาพ\nออกแบบสำหรับเด็กที่ยังอ่านตัวเลขหรือคำไม่ได้: ไทล์รูปภาพขนาดใหญ่ เสียงอ่าน และการลากที่ง่าย\n\nสำหรับลูก\n• กิจวัตรประจำวัน: ตอนเช้า หลังเลิกเรียน และก่อนนอน ตามลำดับ\n• ทีละขั้นตอน: ล้างมือ ทำอาหาร ขึ้นรถบัส ขั้นตอนที่เสร็จแล้วลากไปที่กล่องเสร็จแล้ว\n• หน้าปัดการรอ ความรู้สึก เหรียญคำชมและรางวัล\n• กระดานพูด (AAC) ที่มีคำหลัก 24 คำและโฟลเดอร์ตามหมวด เลือกด้วยสวิตช์ได้\n• แถบพูดในทุกหน้าจอ: ช่วยด้วย ขอพักหน่อย ห้องน้ำ เจ็บ\n• การ์ดคำศัพท์ เรื่องเล่าทางสังคม เรื่องเล่าสถานที่ รายการของออกนอกบ้าน เครื่องวัดระดับเสียงพูด\n\nปรับให้เหมาะกับลูก\n• การ์ดรูปภาพกว่า 1,200 ใบ แบบภาพสีหรือพิกโตแกรม\n• เปลี่ยนการ์ดใบไหนก็ได้เป็นรูปถ่ายจากบ้าน และเปลี่ยนชื่อกับคำที่อ่าน\n• คัดลอกกิจกรรมสำเร็จรูปกว่า 70 แบบแล้วแก้ไขขั้นตอน\n• บนหน้าจอเด็ก กดแม่กุญแจค้าง 3 วินาทีเพื่อแก้ไขหน้าจอนั้นทันที\n• อัดเสียงของคุณเองให้คำบนกระดานพูด\n\nสำหรับผู้ปกครองและครู\n• บันทึกว่าลูกทำเองหรือมีคนช่วย และดูพัฒนาการ\n• แท็บเล็ตที่บ้าน โทรศัพท์นอกบ้าน ใช้กับเด็กหลายคนและผู้ใหญ่หลายคน\n• 28 ภาษา\n\nการสมัครสมาชิก\n7 วันแรกใช้ได้ทุกอย่างฟรี หากยกเลิกในการตั้งค่าการสมัครสมาชิกของสโตร์ก่อนช่วงทดลองสิ้นสุดอย่างน้อย 24 ชั่วโมง จะไม่เสียเงิน หากไม่ยกเลิก แผนรายเดือนหรือรายปีที่เลือกจะเริ่มและต่ออายุอัตโนมัติ การสื่อสารของลูก (แถบพูด กระดานพูด สวิตช์) ใช้ฟรีแม้ไม่ได้สมัครสมาชิก\n\nข้อกำหนดการใช้งาน: https://www.apple.com/legal/internet-services/itunes/dev/stdeula/\nความเป็นส่วนตัว: https://enkingka.github.io/chaguhn-site/privacy.html"}, "id": {"native": "Bahasa Indonesia", "rtl": false, "name": "Chaguhn", "subtitle": "Jadwal visual untuk anak", "promo": "Rutinitas harian, aktivitas langkah demi langkah, pengatur waktu tunggu, dan papan bicara (AAC). Kartu gambar dan suara membantu anak melakukannya sendiri. Gratis 7 hari.", "body": "Chaguhn membantu anak dengan gangguan perkembangan menjalani harinya sendiri, satu gambar demi satu gambar.\nDibuat untuk anak yang belum bisa membaca angka atau kata: kotak gambar besar, suara yang membacakan, dan seret-lepas yang mudah.\n\nUNTUK ANAK ANDA\n• Rutinitas harian: pagi, sepulang sekolah, dan waktu tidur, berurutan\n• Langkah demi langkah: cuci tangan, memasak, naik bus. Setiap langkah yang selesai diseret ke kotak Selesai\n• Dial menunggu, perasaan, token pujian, dan hadiah\n• Papan bicara (AAC) dengan 24 kata inti dan folder per topik, sakelar\n• Bilah bicara di setiap layar: Tolong, Aku mau istirahat, Toilet, Sakit\n• Kartu kata, cerita sosial, cerita tempat, daftar bawaan, pengukur volume suara\n\nSESUAI UNTUK ANAK ANDA\n• Lebih dari 1.200 kartu gambar berwarna atau piktogram\n• Ganti kartu apa pun dengan foto dari rumah, ubah nama dan kata yang dibacakan\n• Salin lebih dari 70 aktivitas siap pakai dan ubah langkahnya\n• Di layar anak, tahan gembok 3 detik untuk langsung mengubah layar itu\n• Rekam suara Anda sendiri untuk kata di papan bicara\n\nUNTUK ORANG TUA DAN GURU\n• Catat apakah anak melakukannya sendiri atau dibantu, dan lihat perkembangannya\n• Tablet di rumah, ponsel di luar; beberapa anak dan orang dewasa\n• 28 bahasa\n\nLANGGANAN\n7 hari pertama semuanya gratis. Jika Anda membatalkan di pengaturan langganan toko paling lambat 24 jam sebelum uji coba berakhir, tidak ada tagihan; jika tidak, paket bulanan atau tahunan yang dipilih dimulai dan diperpanjang otomatis. Komunikasi anak (bilah bicara, papan bicara, sakelar) tetap gratis tanpa langganan.\n\nKetentuan penggunaan: https://www.apple.com/legal/internet-services/itunes/dev/stdeula/\nPrivasi: https://enkingka.github.io/chaguhn-site/privacy.html"}, "ms": {"native": "Bahasa Melayu", "rtl": false, "name": "Chaguhn", "subtitle": "Jadual visual untuk anak", "promo": "Rutin harian, aktiviti langkah demi langkah, pemasa menunggu dan papan bercakap (AAC). Kad gambar dan suara membantu anak melakukannya sendiri. Percuma 7 hari.", "body": "Chaguhn membantu kanak-kanak dengan masalah perkembangan menjalani hari mereka sendiri, satu gambar demi satu gambar.\nDireka untuk kanak-kanak yang belum membaca nombor atau perkataan: petak gambar besar, suara yang membaca dan seret yang mudah.\n\nUNTUK ANAK ANDA\n• Rutin harian: pagi, selepas sekolah dan waktu tidur, mengikut urutan\n• Langkah demi langkah: basuh tangan, memasak, menaiki bas. Setiap langkah yang siap diseret ke kotak Siap\n• Dail menunggu, perasaan, token pujian dan ganjaran\n• Papan bercakap (AAC) dengan 24 perkataan teras dan folder mengikut topik, suis\n• Bar bercakap pada setiap skrin: Tolong, Saya mahu rehat, Tandas, Sakit\n• Kad perkataan, cerita sosial, cerita tempat, senarai barang keluar, pengukur kekuatan suara\n\nSESUAI UNTUK ANAK ANDA\n• Lebih 1,200 kad gambar berwarna atau piktogram\n• Tukar mana-mana kad dengan foto dari rumah, ubah nama dan perkataan yang dibaca\n• Salin lebih 70 aktiviti sedia ada dan ubah langkahnya\n• Pada skrin anak, tekan lama mangga 3 saat untuk terus mengubah skrin itu\n• Rakam suara anda sendiri untuk perkataan papan bercakap\n\nUNTUK IBU BAPA DAN GURU\n• Catat sama ada anak melakukannya sendiri atau dengan bantuan, dan lihat kemajuan\n• Tablet di rumah, telefon di luar; beberapa kanak-kanak dan orang dewasa\n• 28 bahasa\n\nLANGGANAN\n7 hari pertama semuanya percuma. Jika anda membatalkan dalam tetapan langganan kedai sekurang-kurangnya 24 jam sebelum percubaan tamat, tiada caj; jika tidak, pelan bulanan atau tahunan yang dipilih bermula dan diperbaharui secara automatik. Komunikasi anak (bar bercakap, papan bercakap, suis) kekal percuma tanpa langganan.\n\nTerma penggunaan: https://www.apple.com/legal/internet-services/itunes/dev/stdeula/\nPrivasi: https://enkingka.github.io/chaguhn-site/privacy.html"}, "fil": {"native": "Filipino", "rtl": false, "name": "Chaguhn", "subtitle": "Visual na iskedyul ng bata", "promo": "Pang-araw-araw na gawain, sunod-sunod na aktibidad, timer at board sa pagsasalita (AAC). Tumutulong ang larawan at boses para magawa ito ng bata. 7 araw libre.", "body": "Tinutulungan ng Chaguhn ang mga batang may kapansanan sa paglaki na sundin ang kanilang araw nang mag-isa, isang larawan sa bawat pagkakataon.\nPara sa mga batang hindi pa nakakabasa ng numero o salita: malalaking picture tile, boses na nagbabasa at simpleng pag-drag.\n\nPARA SA ANAK MO\n• Pang-araw-araw na gawain: umaga, pagkatapos ng klase at bago matulog, nang sunod-sunod\n• Sunod-sunod: paghuhugas ng kamay, pagluluto, pagsakay sa bus. Bawat tapos na hakbang ay ilalagay sa kahong Tapos\n• Dial sa paghihintay, damdamin, token ng papuri at gantimpala\n• Board sa pagsasalita (AAC) na may 24 na pangunahing salita at folder ayon sa paksa, switch\n• Bar sa pagsasalita sa bawat screen: Tulong, Gusto kong magpahinga, CR, Masakit\n• Word card, kuwentong panlipunan, kuwento ng lugar, listahan ng dadalhin, sukatan ng lakas ng boses\n\nANGKOP SA ANAK MO\n• Mahigit 1,200 picture card na may kulay o pictogram\n• Palitan ang kahit anong card ng litrato mula sa bahay, at palitan ang pangalan at babasahing salita\n• Kopyahin ang mahigit 70 nakahandang aktibidad at baguhin ang mga hakbang\n• Sa screen ng bata, pindutin nang 3 segundo ang kandado para baguhin agad ang screen na iyon\n• I-record ang sarili mong boses para sa mga salita sa board\n\nPARA SA MAGULANG AT GURO\n• Itala kung ginawa ng bata nang mag-isa o may tulong, at tingnan ang pag-unlad\n• Tablet sa bahay, phone sa labas; ilang bata at matanda\n• 28 wika\n\nSUBSCRIPTION\nLibre ang lahat sa unang 7 araw. Kung magkansela ka sa mga setting ng subscription ng store nang hindi bababa sa 24 oras bago matapos ang trial, wala kang babayaran; kung hindi, magsisimula ang napiling buwanan o taunang plan at awtomatikong ire-renew. Libre pa rin ang komunikasyon ng anak mo (bar sa pagsasalita, board, switch) kahit walang subscription.\n\nMga tuntunin ng paggamit: https://www.apple.com/legal/internet-services/itunes/dev/stdeula/\nPrivacy: https://enkingka.github.io/chaguhn-site/privacy.html"}, "hi": {"native": "हिन्दी", "rtl": false, "name": "Chaguhn", "subtitle": "बच्चों के लिए चित्र दिनचर्या", "promo": "रोज़ की दिनचर्या, कदम-दर-कदम गतिविधियाँ, इंतज़ार टाइमर और बोलने वाला बोर्ड (AAC)। तस्वीर कार्ड और पढ़ने वाली आवाज़ बच्चे को ख़ुद करने में मदद करते हैं। 7 दिन मुफ़्त।", "body": "Chaguhn विकास संबंधी अक्षमता वाले बच्चों को अपना दिन ख़ुद, एक-एक तस्वीर के साथ पूरा करने में मदद करता है।\nउन बच्चों के लिए जो अभी अंक या शब्द नहीं पढ़ते: बड़ी तस्वीर टाइलें, पढ़ने वाली आवाज़ और आसान खींचना।\n\nआपके बच्चे के लिए\n• रोज़ की दिनचर्या: सुबह, स्कूल के बाद और सोने से पहले, क्रम से\n• कदम-दर-कदम: हाथ धोना, खाना बनाना, बस में चढ़ना। हर पूरा कदम 'हो गया' बॉक्स में\n• इंतज़ार डायल, भावनाएँ, शाबाशी टोकन और इनाम\n• 24 मुख्य शब्दों और विषय फ़ोल्डरों वाला बोलने वाला बोर्ड (AAC), स्विच से चुनना\n• हर स्क्रीन पर बोलने की पट्टी: मदद करो, मुझे आराम चाहिए, शौचालय, दर्द हो रहा है\n• शब्द कार्ड, सामाजिक कहानियाँ, जगहों की कहानियाँ, बाहर जाने की सूची, आवाज़ की ऊँचाई मीटर\n\nआपके बच्चे के हिसाब से\n• रंगीन चित्र या पिक्टोग्राम शैली में 1,200 से ज़्यादा तस्वीर कार्ड\n• किसी भी कार्ड को घर की फ़ोटो से बदलें, नाम और पढ़े जाने वाले शब्द बदलें\n• 70 से ज़्यादा तैयार गतिविधियाँ कॉपी करके कदम बदलें\n• बच्चे की स्क्रीन पर ताला 3 सेकंड दबाकर उसे तुरंत बदलें\n• बोर्ड के शब्दों के लिए अपनी आवाज़ रिकॉर्ड करें\n\nमाता-पिता और शिक्षकों के लिए\n• दर्ज करें कि बच्चे ने ख़ुद किया या मदद से, और प्रगति देखें\n• घर पर टैबलेट, बाहर फ़ोन; कई बच्चे और बड़े\n• 28 भाषाएँ\n\nसदस्यता\nपहले 7 दिन सब कुछ मुफ़्त है। ट्रायल ख़त्म होने से कम से कम 24 घंटे पहले स्टोर की सदस्यता सेटिंग में रद्द करने पर कोई शुल्क नहीं लगता; वरना चुना गया मासिक या वार्षिक प्लान शुरू होकर अपने-आप नवीनीकृत होता है। बच्चे की बातचीत (बोलने की पट्टी, बोर्ड, स्विच) बिना सदस्यता के भी मुफ़्त है।\n\nउपयोग की शर्तें: https://www.apple.com/legal/internet-services/itunes/dev/stdeula/\nगोपनीयता: https://enkingka.github.io/chaguhn-site/privacy.html"}, "bn": {"native": "বাংলা", "rtl": false, "name": "Chaguhn", "subtitle": "শিশুদের জন্য ছবির রুটিন", "promo": "দৈনিক রুটিন, ধাপে ধাপে কাজ, অপেক্ষার টাইমার আর কথা বলার বোর্ড (AAC)। ছবির কার্ড আর পড়ার কণ্ঠ শিশুকে নিজে করতে সাহায্য করে। ৭ দিন ফ্রি।", "body": "Chaguhn বিকাশজনিত প্রতিবন্ধকতা থাকা শিশুদের নিজের দিন নিজে, একটা একটা ছবি দেখে পার করতে সাহায্য করে।\nযে শিশুরা এখনও সংখ্যা বা শব্দ পড়ে না তাদের জন্য: বড় ছবির টাইল, পড়ার কণ্ঠ আর সহজ টেনে আনা।\n\nআপনার শিশুর জন্য\n• দৈনিক রুটিন: সকাল, স্কুলের পরে আর ঘুমের আগে, ক্রমানুসারে\n• ধাপে ধাপে: হাত ধোয়া, রান্না, বাসে ওঠা। প্রতিটি শেষ ধাপ 'হয়ে গেছে' বাক্সে\n• অপেক্ষার ডায়াল, অনুভূতি, প্রশংসা টোকেন ও পুরস্কার\n• ২৪টি মূল শব্দ আর বিষয়ের ফোল্ডারসহ কথা বলার বোর্ড (AAC), সুইচ দিয়ে বাছা\n• প্রতিটি পর্দায় কথা বলার বার: সাহায্য করো, আমি বিরতি চাই, টয়লেট, ব্যথা লাগছে\n• শব্দ কার্ড, সামাজিক গল্প, জায়গার গল্প, বাইরে যাওয়ার তালিকা, কণ্ঠের জোর মাপা\n\nআপনার শিশুর মতো করে\n• রঙিন চিত্র বা পিক্টোগ্রামে ১,২০০-এর বেশি ছবির কার্ড\n• যেকোনো কার্ড বাড়ির ছবি দিয়ে বদলান, নাম আর পড়ার শব্দ বদলান\n• ৭০-এর বেশি তৈরি কাজ কপি করে ধাপ বদলান\n• শিশুর পর্দায় তালা ৩ সেকেন্ড চেপে সঙ্গে সঙ্গে সেটি বদলান\n• বোর্ডের শব্দের জন্য নিজের কণ্ঠ রেকর্ড করুন\n\nঅভিভাবক ও শিক্ষকদের জন্য\n• শিশু নিজে করেছে নাকি সাহায্য নিয়ে, লিখে রাখুন আর অগ্রগতি দেখুন\n• বাড়িতে ট্যাবলেট, বাইরে ফোন; একাধিক শিশু ও বড়\n• ২৮টি ভাষা\n\nসাবস্ক্রিপশন\nপ্রথম ৭ দিন সব ফ্রি। ট্রায়াল শেষের অন্তত ২৪ ঘণ্টা আগে স্টোরের সাবস্ক্রিপশন সেটিং থেকে বাতিল করলে কোনো টাকা কাটা হয় না; নইলে বাছাই করা মাসিক বা বার্ষিক প্ল্যান শুরু হয়ে নিজে থেকে নবায়ন হয়। শিশুর যোগাযোগ (কথা বলার বার, বোর্ড, সুইচ) সাবস্ক্রিপশন ছাড়াও ফ্রি।\n\nব্যবহারের শর্ত: https://www.apple.com/legal/internet-services/itunes/dev/stdeula/\nগোপনীয়তা: https://enkingka.github.io/chaguhn-site/privacy.html"}, "fr": {"native": "Français", "rtl": false, "name": "Chaguhn", "subtitle": "Emploi du temps visuel enfant", "promo": "Journée en images, activités pas à pas, minuteur d'attente et tableau de communication (CAA). Cartes et voix aident votre enfant à faire seul. 7 jours gratuits.", "body": "Chaguhn aide les enfants avec un trouble du développement à suivre leur journée seuls, une image à la fois.\nPensé pour les enfants qui ne lisent pas encore les chiffres ni les mots : grandes tuiles en images, une voix qui lit et un simple glisser-déposer.\n\nPOUR VOTRE ENFANT\n• La journée : le matin, après l'école et le coucher, dans l'ordre\n• Pas à pas : se laver les mains, cuisiner, prendre le bus. Chaque étape finie va dans la boîte Fini\n• Cadran d'attente, émotions, jetons de félicitation et récompenses\n• Tableau de communication (CAA) avec 24 mots de base et des dossiers par thème, contacteur\n• Une barre de parole sur chaque écran : Aide-moi, Je veux une pause, Toilettes, J'ai mal\n• Cartes de mots, histoires sociales, histoires de lieux, liste pour sortir, mesure du volume de la voix\n\nADAPTÉ À VOTRE ENFANT\n• Plus de 1 200 cartes images, en couleur ou en pictogramme\n• Remplacez une carte par une photo de la maison, changez son nom et les mots lus\n• Copiez plus de 70 activités prêtes et modifiez les étapes\n• Sur l'écran de l'enfant, appuyez 3 secondes sur le cadenas pour modifier cet écran tout de suite\n• Enregistrez votre voix pour les mots du tableau\n\nPOUR LES PARENTS ET LES PROFESSIONNELS\n• Notez si l'enfant a réussi seul ou avec de l'aide et voyez ses progrès\n• Une tablette à la maison, un téléphone dehors ; plusieurs enfants et adultes\n• 28 langues\n\nABONNEMENT\nLes 7 premiers jours, tout est gratuit. Si vous résiliez dans les réglages d'abonnement de votre boutique au moins 24 heures avant la fin de l'essai, rien n'est facturé ; sinon, la formule mensuelle ou annuelle choisie commence et se renouvelle automatiquement. La communication de votre enfant (barre de parole, tableau, contacteur) reste gratuite sans abonnement.\n\nConditions d'utilisation : https://www.apple.com/legal/internet-services/itunes/dev/stdeula/\nConfidentialité : https://enkingka.github.io/chaguhn-site/privacy.html"}, "de": {"native": "Deutsch", "rtl": false, "name": "Chaguhn", "subtitle": "Visueller Tagesplan für Kinder", "promo": "Tagesablauf, Schritt-für-Schritt-Aufgaben, Warte-Timer und Sprechtafel (UK). Bildkarten und eine Vorlesestimme helfen Ihrem Kind, es selbst zu schaffen. 7 Tage gratis.", "body": "Chaguhn hilft Kindern mit Entwicklungsbeeinträchtigungen, ihren Tag selbstständig zu bewältigen – Bild für Bild.\nGemacht für Kinder, die noch keine Zahlen oder Wörter lesen: große Bildkacheln, eine Vorlesestimme und einfaches Ziehen.\n\nFÜR IHR KIND\n• Tagesablauf: Morgen, nach der Schule und Schlafenszeit der Reihe nach\n• Schritt für Schritt: Händewaschen, Kochen, Busfahren. Jeden erledigten Schritt in die Fertig-Box ziehen\n• Warte-Drehscheibe, Gefühle, Lobmarken und Belohnungen\n• Sprechtafel (UK) mit 24 Kernwörtern und Themenordnern, Schalterbedienung\n• Eine Sprechleiste auf jedem Bildschirm: Hilfe, Ich brauche eine Pause, Toilette, Es tut weh\n• Wortkarten, soziale Geschichten, Ortsgeschichten, Packliste für unterwegs, Lautstärkemesser\n\nPASSEND FÜR IHR KIND\n• Über 1.200 Bildkarten im Farb- oder Piktogrammstil\n• Jede Karte durch ein Foto von zu Hause ersetzen, Namen und vorgelesene Wörter ändern\n• Über 70 fertige Aktivitäten kopieren und die Schritte anpassen\n• Auf jedem Kinderbildschirm das Schloss 3 Sekunden halten und diesen Bildschirm sofort bearbeiten\n• Eigene Stimme für Wörter der Sprechtafel aufnehmen\n\nFÜR ELTERN UND FACHKRÄFTE\n• Festhalten, ob Ihr Kind es allein oder mit Hilfe geschafft hat, und die Entwicklung sehen\n• Tablet zu Hause, Handy unterwegs; mehrere Kinder und Erwachsene\n• 28 Sprachen\n\nABO\nIn den ersten 7 Tagen sind alle Funktionen gratis. Wenn Sie spätestens 24 Stunden vor Ende der Testphase in den Abo-Einstellungen Ihres Stores kündigen, wird nichts berechnet; sonst beginnt der gewählte Monats- oder Jahrestarif und verlängert sich automatisch. Die Kommunikation Ihres Kindes (Sprechleiste, Sprechtafel, Schalterbedienung) bleibt ohne Abo kostenlos.\n\nNutzungsbedingungen: https://www.apple.com/legal/internet-services/itunes/dev/stdeula/\nDatenschutz: https://enkingka.github.io/chaguhn-site/privacy.html"}, "es": {"native": "Español", "rtl": false, "name": "Chaguhn", "subtitle": "Agenda visual para niños", "promo": "Rutinas del día, actividades paso a paso, temporizador de espera y tablero para hablar (SAAC). Pictos y una voz que lee ayudan a tu hijo a hacerlo solo. 7 días gratis.", "body": "Chaguhn ayuda a niños y niñas con trastornos del desarrollo a seguir su día por sí mismos, imagen a imagen.\nPensada para quienes aún no leen números ni palabras: grandes casillas con imágenes, una voz que lee y un simple arrastrar.\n\nPARA TU HIJO O HIJA\n• Mi día: mañana, después del cole y hora de dormir, en orden\n• Paso a paso: lavarse las manos, cocinar, tomar el autobús. Cada paso terminado va a la caja de Hecho\n• Dial de espera, emociones, fichas de premio y recompensas\n• Tablero para hablar (SAAC) con 24 palabras básicas y carpetas por tema, pulsador\n• Una barra para hablar en cada pantalla: Ayúdame, Quiero un descanso, Baño, Me duele\n• Tarjetas de palabras, historias sociales, historias de lugares, lista para salir, medidor del volumen de la voz\n\nADAPTADA A TU HIJO O HIJA\n• Más de 1.200 tarjetas en color o en pictograma\n• Cambia cualquier tarjeta por una foto de casa y cambia su nombre y lo que se lee\n• Copia más de 70 actividades listas y edita los pasos\n• En la pantalla del niño, mantén el candado 3 segundos para editar esa pantalla al momento\n• Graba tu propia voz para las palabras del tablero\n\nPARA FAMILIAS Y DOCENTES\n• Anota si lo hizo solo o con ayuda y mira su progreso\n• Tableta en casa y móvil fuera; varios niños y adultos\n• 28 idiomas\n\nSUSCRIPCIÓN\nLos primeros 7 días todo es gratis. Si cancelas en los ajustes de suscripción de tu tienda al menos 24 horas antes de que termine la prueba, no se cobra nada; si no, empieza el plan mensual o anual elegido y se renueva automáticamente. La comunicación de tu hijo o hija (barra para hablar, tablero, pulsador) sigue siendo gratis sin suscripción.\n\nCondiciones de uso: https://www.apple.com/legal/internet-services/itunes/dev/stdeula/\nPrivacidad: https://enkingka.github.io/chaguhn-site/privacy.html"}, "pt": {"native": "Português", "rtl": false, "name": "Chaguhn", "subtitle": "Rotina visual para crianças", "promo": "Rotina do dia, atividades passo a passo, timer de espera e prancha de comunicação (CAA). Cartões e uma voz que lê ajudam sua criança a fazer sozinha. 7 dias grátis.", "body": "O Chaguhn ajuda crianças com transtornos do desenvolvimento a seguir o dia sozinhas, uma imagem de cada vez.\nFeito para quem ainda não lê números nem palavras: quadros grandes com imagens, uma voz que lê e um simples arrastar.\n\nPARA SUA CRIANÇA\n• Rotina do dia: manhã, depois da escola e hora de dormir, em ordem\n• Passo a passo: lavar as mãos, cozinhar, pegar o ônibus. Cada passo feito vai para a caixa Pronto\n• Mostrador de espera, sentimentos, fichas de elogio e recompensas\n• Prancha de comunicação (CAA) com 24 palavras essenciais e pastas por tema, acionador\n• Uma barra de fala em todas as telas: Me ajuda, Quero uma pausa, Banheiro, Está doendo\n• Cartões de palavras, histórias sociais, histórias de lugares, lista para sair, medidor do volume da voz\n\nDO JEITO DA SUA CRIANÇA\n• Mais de 1.200 cartões em cores ou em pictograma\n• Troque qualquer cartão por uma foto de casa e mude o nome e o que é lido\n• Copie mais de 70 atividades prontas e edite os passos\n• Na tela da criança, segure o cadeado por 3 segundos para editar aquela tela na hora\n• Grave sua própria voz para as palavras da prancha\n\nPARA FAMÍLIAS E PROFESSORES\n• Anote se fez sozinha ou com ajuda e acompanhe o progresso\n• Tablet em casa e celular na rua; várias crianças e adultos\n• 28 idiomas\n\nASSINATURA\nNos primeiros 7 dias tudo é grátis. Se você cancelar nas configurações de assinatura da sua loja pelo menos 24 horas antes do fim do teste, nada é cobrado; se não, começa o plano mensal ou anual escolhido, com renovação automática. A comunicação da sua criança (barra de fala, prancha, acionador) continua grátis sem assinatura.\n\nTermos de uso: https://www.apple.com/legal/internet-services/itunes/dev/stdeula/\nPrivacidade: https://enkingka.github.io/chaguhn-site/privacy.html"}, "it": {"native": "Italiano", "rtl": false, "name": "Chaguhn", "subtitle": "Agenda visiva per bambini", "promo": "Giornata in immagini, attività passo passo, timer di attesa e tabella per parlare (CAA). Carte e una voce che legge aiutano tuo figlio a fare da solo. 7 giorni gratis.", "body": "Chaguhn aiuta i bambini con disturbi dello sviluppo a seguire la giornata da soli, un'immagine alla volta.\nPensata per chi non legge ancora numeri e parole: grandi riquadri con immagini, una voce che legge e un semplice trascinamento.\n\nPER TUO FIGLIO\n• La giornata: mattina, dopo la scuola e la nanna, in ordine\n• Passo passo: lavarsi le mani, cucinare, prendere l'autobus. Ogni passo finito va nella scatola Fatto\n• Quadrante di attesa, emozioni, gettoni di lode e premi\n• Tabella per parlare (CAA) con 24 parole di base e cartelle per argomento, sensore\n• Una barra per parlare su ogni schermata: Aiutami, Voglio una pausa, Bagno, Mi fa male\n• Carte delle parole, storie sociali, storie dei luoghi, lista per uscire, misuratore del volume della voce\n\nSU MISURA PER TUO FIGLIO\n• Oltre 1.200 carte a colori o in pittogramma\n• Sostituisci una carta con una foto di casa e cambia nome e parole lette\n• Copia oltre 70 attività pronte e modifica i passi\n• Sulla schermata del bambino tieni premuto il lucchetto 3 secondi per modificarla subito\n• Registra la tua voce per le parole della tabella\n\nPER GENITORI E INSEGNANTI\n• Annota se ha fatto da solo o con aiuto e guarda i progressi\n• Tablet a casa e telefono fuori; più bambini e più adulti\n• 28 lingue\n\nABBONAMENTO\nI primi 7 giorni tutto è gratis. Se annulli nelle impostazioni abbonamenti del tuo store almeno 24 ore prima della fine della prova, non paghi nulla; altrimenti inizia il piano mensile o annuale scelto, con rinnovo automatico. La comunicazione di tuo figlio (barra per parlare, tabella, sensore) resta gratuita senza abbonamento.\n\nCondizioni d'uso: https://www.apple.com/legal/internet-services/itunes/dev/stdeula/\nPrivacy: https://enkingka.github.io/chaguhn-site/privacy.html"}, "nl": {"native": "Nederlands", "rtl": false, "name": "Chaguhn", "subtitle": "Visueel dagritme voor kinderen", "promo": "Dagritme, stap-voor-stap-activiteiten, een wachttimer en een praatbord (OC). Plaatjes en een voorleesstem helpen je kind het zelf te doen. 7 dagen gratis.", "body": "Chaguhn helpt kinderen met een ontwikkelingsstoornis om hun dag zelf te volgen, plaatje voor plaatje.\nGemaakt voor kinderen die nog geen cijfers of woorden lezen: grote plaatjestegels, een voorleesstem en eenvoudig slepen.\n\nVOOR JE KIND\n• Dagritme: ochtend, na school en bedtijd, op volgorde\n• Stap voor stap: handen wassen, koken, de bus nemen. Elke klaar-stap gaat in het Klaar-vak\n• Wachtklok, gevoelens, complimentfiches en beloningen\n• Praatbord (OC) met 24 kernwoorden en mappen per thema, schakelaarbediening\n• Een praatbalk op elk scherm: Help me, Ik wil pauze, Wc, Het doet pijn\n• Woordkaarten, sociale verhalen, plekverhalen, paklijst voor op pad, stemvolumemeter\n\nPASSEND VOOR JE KIND\n• Meer dan 1.200 plaatjeskaarten in kleur of als pictogram\n• Vervang elke kaart door een foto van thuis en verander naam en voorgelezen woorden\n• Kopieer meer dan 70 kant-en-klare activiteiten en pas de stappen aan\n• Houd op elk kinderscherm het slotje 3 seconden vast om dat scherm meteen aan te passen\n• Neem je eigen stem op voor woorden op het praatbord\n\nVOOR OUDERS EN LEERKRACHTEN\n• Noteer of je kind het alleen of met hulp deed en zie de voortgang\n• Tablet thuis, telefoon onderweg; meerdere kinderen en volwassenen\n• 28 talen\n\nABONNEMENT\nDe eerste 7 dagen is alles gratis. Zeg je minstens 24 uur voor het einde van de proef op in de abonnementsinstellingen van je winkel, dan betaal je niets; anders start het gekozen maand- of jaarabonnement en wordt het automatisch verlengd. De communicatie van je kind (praatbalk, praatbord, schakelaar) blijft zonder abonnement gratis.\n\nGebruiksvoorwaarden: https://www.apple.com/legal/internet-services/itunes/dev/stdeula/\nPrivacy: https://enkingka.github.io/chaguhn-site/privacy.html"}, "pl": {"native": "Polski", "rtl": false, "name": "Chaguhn", "subtitle": "Wizualny plan dnia dla dzieci", "promo": "Plan dnia, zadania krok po kroku, minutnik czekania i tablica do mówienia (AAC). Obrazki i czytający głos pomagają dziecku robić to samodzielnie. 7 dni za darmo.", "body": "Chaguhn pomaga dzieciom z zaburzeniami rozwoju samodzielnie przejść przez dzień – obrazek po obrazku.\nDla dzieci, które nie czytają jeszcze cyfr ani słów: duże kafelki z obrazkami, głos, który czyta, i proste przeciąganie.\n\nDLA DZIECKA\n• Plan dnia: rano, po szkole i przed snem, po kolei\n• Krok po kroku: mycie rąk, gotowanie, jazda autobusem. Każdy zrobiony krok trafia do pudełka Gotowe\n• Tarcza czekania, uczucia, żetony pochwały i nagrody\n• Tablica do mówienia (AAC) z 24 słowami podstawowymi i folderami tematycznymi, przełącznik\n• Pasek mówienia na każdym ekranie: Pomóż mi, Chcę przerwę, Toaleta, Boli\n• Karty ze słowami, historyjki społeczne, historyjki o miejscach, lista na wyjście, miernik głośności głosu\n\nDOPASOWANE DO DZIECKA\n• Ponad 1200 kart z obrazkami w kolorze lub jako piktogramy\n• Zamień każdą kartę na zdjęcie z domu, zmień nazwę i czytane słowa\n• Skopiuj ponad 70 gotowych aktywności i zmień kroki\n• Na ekranie dziecka przytrzymaj kłódkę 3 sekundy, by od razu go zmienić\n• Nagraj własny głos dla słów na tablicy\n\nDLA RODZICÓW I NAUCZYCIELI\n• Zapisuj, czy dziecko zrobiło coś samo, czy z pomocą, i obserwuj postępy\n• Tablet w domu, telefon poza domem; kilkoro dzieci i dorosłych\n• 28 języków\n\nSUBSKRYPCJA\nPrzez pierwsze 7 dni wszystko jest za darmo. Jeśli anulujesz w ustawieniach subskrypcji sklepu co najmniej 24 godziny przed końcem okresu próbnego, nic nie zapłacisz; w przeciwnym razie zacznie się wybrany plan miesięczny lub roczny, odnawiany automatycznie. Komunikacja dziecka (pasek mówienia, tablica, przełącznik) pozostaje bezpłatna bez subskrypcji.\n\nWarunki korzystania: https://www.apple.com/legal/internet-services/itunes/dev/stdeula/\nPrywatność: https://enkingka.github.io/chaguhn-site/privacy.html"}, "sv": {"native": "Svenska", "rtl": false, "name": "Chaguhn", "subtitle": "Visuellt dagsschema för barn", "promo": "Dagsrutin, steg-för-steg-aktiviteter, väntetimer och pratkarta (AKK). Bilder och en uppläsande röst hjälper ditt barn att klara det själv. 7 dagar gratis.", "body": "Chaguhn hjälper barn med funktionsnedsättningar att klara sin dag själva, en bild i taget.\nGjord för barn som ännu inte läser siffror eller ord: stora bildrutor, en röst som läser upp och enkel dra-och-släpp.\n\nFÖR DITT BARN\n• Dagsrutin: morgon, efter skolan och läggdags, i ordning\n• Steg för steg: tvätta händerna, laga mat, åka buss. Varje klart steg dras till Klar-lådan\n• Väntetimer, känslor, berömpolletter och belöningar\n• Pratkarta (AKK) med 24 kärnord och mappar per ämne, kontaktstyrning\n• En pratlist på varje skärm: Hjälp mig, Jag vill ha paus, Toaletten, Det gör ont\n• Ordkort, sociala berättelser, platsberättelser, packlista, röstvolymmätare\n\nANPASSAT EFTER DITT BARN\n• Över 1 200 bildkort i färg eller som piktogram\n• Byt ut ett kort mot ett foto hemifrån och ändra namn och upplästa ord\n• Kopiera över 70 färdiga aktiviteter och ändra stegen\n• Håll låset i 3 sekunder på barnets skärm för att ändra den direkt\n• Spela in din egen röst för ord på pratkartan\n\nFÖR FÖRÄLDRAR OCH PEDAGOGER\n• Notera om barnet klarade det själv eller med hjälp och se utvecklingen\n• Surfplatta hemma, mobil ute; flera barn och vuxna\n• 28 språk\n\nPRENUMERATION\nDe första 7 dagarna är allt gratis. Om du avslutar i butikens prenumerationsinställningar minst 24 timmar innan provperioden slutar betalar du ingenting; annars börjar den valda månads- eller årsplanen och förnyas automatiskt. Barnets kommunikation (pratlist, pratkarta, kontaktstyrning) är gratis utan prenumeration.\n\nAnvändarvillkor: https://www.apple.com/legal/internet-services/itunes/dev/stdeula/\nIntegritet: https://enkingka.github.io/chaguhn-site/privacy.html"}, "da": {"native": "Dansk", "rtl": false, "name": "Chaguhn", "subtitle": "Visuel dagsplan for børn", "promo": "Dagsrutine, trin-for-trin-aktiviteter, ventetimer og taletavle (ASK). Billeder og en oplæsende stemme hjælper dit barn med at klare det selv. 7 dage gratis.", "body": "Chaguhn hjælper børn med udviklingsforstyrrelser med at klare dagen selv, ét billede ad gangen.\nLavet til børn, der endnu ikke læser tal eller ord: store billedfelter, en stemme, der læser op, og enkel træk-og-slip.\n\nTIL DIT BARN\n• Dagsrutine: morgen, efter skole og sengetid, i rækkefølge\n• Trin for trin: vaske hænder, lave mad, tage bussen. Hvert færdigt trin trækkes over i Færdig-kassen\n• Venteskive, følelser, rosjetoner og belønninger\n• Taletavle (ASK) med 24 kerneord og mapper efter emne, kontaktstyring\n• En talebjælke på hver skærm: Hjælp mig, Jeg vil have en pause, Toilet, Det gør ondt\n• Ordkort, sociale historier, stedhistorier, pakkeliste, stemmestyrkemåler\n\nTILPASSET DIT BARN\n• Over 1.200 billedkort i farver eller som piktogrammer\n• Skift et kort ud med et foto hjemmefra og ændr navn og oplæste ord\n• Kopiér over 70 færdige aktiviteter og ret trinene\n• Hold låsen i 3 sekunder på barnets skærm for at ændre den med det samme\n• Optag din egen stemme til ord på taletavlen\n\nTIL FORÆLDRE OG PÆDAGOGER\n• Notér, om barnet klarede det selv eller med hjælp, og følg udviklingen\n• Tablet derhjemme, telefon ude; flere børn og voksne\n• 28 sprog\n\nABONNEMENT\nDe første 7 dage er alt gratis. Hvis du opsiger i butikkens abonnementsindstillinger mindst 24 timer før prøveperioden slutter, betaler du intet; ellers starter den valgte måneds- eller årsplan og fornyes automatisk. Barnets kommunikation (talebjælke, taletavle, kontaktstyring) er gratis uden abonnement.\n\nVilkår for brug: https://www.apple.com/legal/internet-services/itunes/dev/stdeula/\nPrivatliv: https://enkingka.github.io/chaguhn-site/privacy.html"}, "nb": {"native": "Norsk bokmål", "rtl": false, "name": "Chaguhn", "subtitle": "Visuell dagsplan for barn", "promo": "Dagsrutine, steg-for-steg-aktiviteter, ventetimer og snakketavle (ASK). Bilder og en stemme som leser opp hjelper barnet å klare det selv. 7 dager gratis.", "body": "Chaguhn hjelper barn med utviklingsforstyrrelser å klare dagen selv, ett bilde om gangen.\nLaget for barn som ennå ikke leser tall eller ord: store bildefelt, en stemme som leser opp og enkel dra-og-slipp.\n\nFOR BARNET DITT\n• Dagsrutine: morgen, etter skolen og leggetid, i rekkefølge\n• Steg for steg: vaske hendene, lage mat, ta bussen. Hvert ferdig steg dras til Ferdig-boksen\n• Venteskive, følelser, rospoletter og belønninger\n• Snakketavle (ASK) med 24 kjerneord og mapper etter tema, bryterstyring\n• En snakkelinje på hver skjerm: Hjelp meg, Jeg vil ha pause, Do, Det gjør vondt\n• Ordkort, sosiale historier, stedshistorier, pakkeliste, stemmestyrkemåler\n\nTILPASSET BARNET DITT\n• Over 1 200 bildekort i farger eller som piktogrammer\n• Bytt et kort med et bilde hjemmefra og endre navn og ord som leses opp\n• Kopier over 70 ferdige aktiviteter og endre stegene\n• Hold låsen i 3 sekunder på barneskjermen for å endre den med en gang\n• Ta opp din egen stemme til ord på snakketavlen\n\nFOR FORELDRE OG PEDAGOGER\n• Noter om barnet klarte det selv eller med hjelp, og følg utviklingen\n• Nettbrett hjemme, mobil ute; flere barn og voksne\n• 28 språk\n\nABONNEMENT\nDe første 7 dagene er alt gratis. Avslutter du i butikkens abonnementsinnstillinger minst 24 timer før prøveperio s://enkingka.github.io/chaguhn-site/privacy.html"}, "tr": {"native": "Türkçe", "rtl": false, "name": "Chaguhn", "subtitle": "Çocuklar için görsel program", "promo": "Günlük rutin, adım adım etkinlikler, bekleme zamanlayıcısı ve konuşma panosu (AAC). Resimler ve sesli okuma çocuğunuzun kendi başına yapmasına yardım eder. 7 gün bedava.", "body": "Chaguhn, gelişimsel yetersizliği olan çocukların gününü kendi başına, resim resim takip etmesine yardımcı olur.\nHenüz sayı veya kelime okuyamayan çocuklar için: büyük resimli kutucuklar, sesli okuma ve basit sürükleme.\n\nÇOCUĞUNUZ İÇİN\n• Günlük rutin: sabah, okul sonrası ve yatma zamanı sırayla\n• Adım adım: el yıkama, yemek yapma, otobüse binme. Biten her adım Bitti kutusuna sürüklenir\n• Bekleme kadranı, duygular, övgü jetonları ve ödüller\n• 24 temel kelime ve konu klasörleriyle konuşma panosu (AAC), anahtarla seçme\n• Her ekranda konuşma çubuğu: Yardım et, Mola istiyorum, Tuvalet, Acıyor\n• Kelime kartları, sosyal hikâyeler, yer hikâyeleri, dışarı çıkma listesi, ses yüksekliği ölçer\n\nÇOCUĞUNUZA GÖRE\n• Renkli veya piktogram stilinde 1.200'den fazla resimli kart\n• Her kartı evden bir fotoğrafla değiştirin, adını ve okunan kelimeleri düzenleyin\n• 70'ten fazla hazır etkinliği kopyalayıp adımları değiştirin\n• Çocuk ekranında kilide 3 saniye basılı tutarak o ekranı hemen düzenleyin\n• Konuşma panosu kelimeleri için kendi sesinizi kaydedin\n\nEBEVEYNLER VE ÖĞRETMENLER İÇİN\n• Kendi başına mı yoksa yardımla mı yaptığını kaydedin, gelişimi görün\n• Evde tablet, dışarıda telefon; birden fazla çocuk ve yetişkin\n• 28 dil\n\nABONELİK\nİlk 7 gün her şey ücretsizdir. Deneme bitmeden en geç 24 saat önce mağazanızın abonelik ayarlarından iptal ederseniz ücret alınmaz; aksi halde seçtiğiniz aylık veya yıllık plan başlar ve otomatik olarak yenilenir. Çocuğunuzun iletişimi (konuşma çubuğu, konuşma panosu, anahtar) abonelik olmadan da ücretsizdir.\n\nKullanım koşulları: https://www.apple.com/legal/internet-services/itunes/dev/stdeul vices/itunes/dev/stdeula/\nКонфиденциальность: https://enkingka.github.io/chaguhn-site/privacy.html"}, "uk": {"native": "Українська", "rtl": false, "name": "Chaguhn", "subtitle": "Візуальний розклад і АДК", "promo": "Розпорядок дня, заняття крок за кроком, таймер очікування та говорильна дошка (АДК). Картинки й голос допомагають дитині впоратися самій. 7 днів безкоштовно.", "body": "«Chaguhn» допомагає дітям з порушеннями розвитку самостійно проходити свій день — картинка за картинкою.\nДля дітей, які ще не читають цифр і слів: великі плитки з картинками, голос, що читає вголос, і просте перетягування.\n\nДЛЯ ДИТИНИ\n• Розпорядок дня: ранок, після школи і перед сном — по черзі\n• Крок за кроком: мити руки, готувати, їхати автобусом. Кожен виконаний крок перетягується в коробку «Готово»\n• Циферблат очікування, почуття, жетони похвали й нагороди\n• Говорильна дошка (АДК) з 24 основними словами й тематичними папками, керування кнопкою\n• Смуга мовлення на кожному екрані: Допоможи, Хочу перепочити, Туалет, Боляче\n• Картки слів, соціальні історії, історії про місця, список речей для виходу, вимірювач гучності голосу\n\nПІД ВАШУ ДИТИНУ\n• Понад 1200 карток у кольорі або у вигляді піктограм\n• Замініть будь-яку картку фото з дому, змініть назву й слова\n• Скопіюйте понад 70 готових занять і змініть кроки\n• На екрані дитини утримуйте замок 3 секунди, щоб одразу його змінити\n• Запишіть свій голос для слів говорильної дошки\n\nДЛЯ БАТЬКІВ І ПЕДАГОГІВ\n• Позначайте, чи дитина зробила сама чи з допомогою, і стежте за поступом\n• Планшет удома, телефон надворі; кілька дітей і дорослих\n• 28 мов\n\nПІДПИСКА\nПерші 7 днів усе безкоштовно. Якщо скасувати в налаштуваннях підписок магазину не пізніше ніж за 24 години до кінця пробного періоду, оплату не буде знято; інакше почнеться вибраний план на місяць чи на рік з автоматичним поновленням. Спілкування дитини (смуга мовлення, говорильна дошка, кнопка) лишається безкоштовним без підписки.\n\nУмови використання: https://www.apple
