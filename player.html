<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="referrer" content="strict-origin-when-cross-origin"><meta name="robots" content="noindex"><title>Chaguhn video</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#p{position:absolute;inset:0;width:100%;height:100%}</style></head>
<body><div id="p"></div><script>
var v=(new URLSearchParams(location.search).get('v')||'');if(!/^[A-Za-z0-9_-]{11}$/.test(v))v='';
function send(m){var s=JSON.stringify(m);try{if(window.ReactNativeWebView)window.ReactNativeWebView.postMessage(s)}catch(e){}try{if(window.parent!==window)window.parent.postMessage(s,'*')}catch(e){}}
var player=null;
function onYouTubeIframeAPIReady(){if(!v){send({t:'error',code:2});return}
player=new YT.Player('p',{videoId:v,width:'100%',height:'100%',host:'https://www.youtube.com',
playerVars:{autoplay:1,playsinline:1,rel:0,fs:0,iv_load_policy:3,disablekb:1,origin:location.origin},
events:{onReady:function(e){try{e.target.playVideo()}catch(_){};send({t:'ready'})},
onStateChange:function(e){send({t:'state',s:e.data})},onError:function(e){send({t:'error',code:e.data})}}})}
window.chaguhn={pause:function(){try{player&&player.pauseVideo()}catch(e){}}};
</script><script src="https://www.youtube.com/iframe_api"></script></body></html>
